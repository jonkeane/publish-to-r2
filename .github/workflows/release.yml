name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Apple Silicon release
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false

      - name: Install Lua
        run: brew install lua

      - name: Test release source
        run: make test

      - name: Build package
        run: make package

      - name: Verify package checksum
        run: shasum -a 256 -c dist/R2Publisher-macos-arm64.zip.sha256

      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/R2Publisher-macos-arm64.zip \
            dist/R2Publisher-macos-arm64.zip.sha256 \
            --generate-notes \
            --verify-tag
